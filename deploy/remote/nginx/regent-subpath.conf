# 由 ichuang.top 的 HTTPS server 块 include；只提供 Regent 子路径，不重复声明 server。
location = /regent {
    return 301 /regent/;
}

location = /regent/api/agent {
    return 404;
}

location ^~ /regent/api/agent/ {
    return 404;
}

location ^~ /regent/api/ {
    rewrite ^/regent/api/(.*)$ /api/$1 break;
    proxy_connect_timeout 60s;
    proxy_send_timeout 240s;
    proxy_read_timeout 240s;
    proxy_http_version 1.1;
    proxy_redirect off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;
    proxy_pass http://127.0.0.1:8788;
}

location ^~ /regent/downloads/ {
    alias __REMOTE_BASE__/downloads/;
    autoindex off;
    add_header Cache-Control "public, max-age=604800";
}

location ^~ /regent/assets/ {
    root __REMOTE_BASE__/frontend;
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    add_header Vary "Accept-Encoding";
    access_log off;
}

location ^~ /regent/ {
    root __REMOTE_BASE__/frontend;
    try_files $uri $uri/ /regent/index.html;
    index index.html;
    add_header Cache-Control "no-cache, no-store";
}
