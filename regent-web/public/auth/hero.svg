<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" width="1200" height="1600">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1727" />
      <stop offset="0.48" stop-color="#090d14" />
      <stop offset="1" stop-color="#04060a" />
    </linearGradient>
    <radialGradient id="glow-blue" cx="0.16" cy="0.08" r="0.78">
      <stop offset="0" stop-color="#2f80ff" stop-opacity="0.72" />
      <stop offset="0.38" stop-color="#145fc4" stop-opacity="0.28" />
      <stop offset="1" stop-color="#08101b" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-teal" cx="0.9" cy="0.82" r="0.72">
      <stop offset="0" stop-color="#35c7b5" stop-opacity="0.3" />
      <stop offset="0.52" stop-color="#167d94" stop-opacity="0.12" />
      <stop offset="1" stop-color="#071018" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-warm" cx="0.72" cy="0.22" r="0.46">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.17" />
      <stop offset="1" stop-color="#0a1019" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="ribbon-a" x1="0" y1="0" x2="1" y2="0.5">
      <stop offset="0" stop-color="#0a84ff" stop-opacity="0" />
      <stop offset="0.28" stop-color="#63b3ff" stop-opacity="0.5" />
      <stop offset="0.62" stop-color="#2f6dff" stop-opacity="0.28" />
      <stop offset="1" stop-color="#0a84ff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="ribbon-b" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#30d158" stop-opacity="0" />
      <stop offset="0.42" stop-color="#8ce8e0" stop-opacity="0.28" />
      <stop offset="0.72" stop-color="#2f9fff" stop-opacity="0.2" />
      <stop offset="1" stop-color="#30d158" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="ribbon-c" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="0.46" stop-color="#c7e5ff" stop-opacity="0.2" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="soften" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="44" />
    </filter>
    <filter id="soften-light" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" />
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.16" />
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="1200" height="1600" fill="url(#base)" />
  <rect width="1200" height="1600" fill="url(#glow-blue)" />
  <rect width="1200" height="1600" fill="url(#glow-warm)" />
  <rect width="1200" height="1600" fill="url(#glow-teal)" />

  <g fill="none" stroke-linecap="round">
    <path
      d="M-160 520 C120 250 380 720 650 470 C900 235 1040 640 1360 370"
      stroke="url(#ribbon-a)"
      stroke-width="184"
      opacity="0.5"
      filter="url(#soften)"
    />
    <path
      d="M-130 840 C190 560 430 1000 760 720 C1010 510 1130 900 1360 650"
      stroke="url(#ribbon-b)"
      stroke-width="126"
      opacity="0.45"
      filter="url(#soften)"
    />
    <path
      d="M-80 300 C240 110 440 470 730 260 C980 80 1120 380 1320 180"
      stroke="url(#ribbon-c)"
      stroke-width="92"
      opacity="0.3"
      filter="url(#soften)"
    />
    <path
      d="M-40 590 C250 330 430 760 710 520 C940 320 1080 690 1300 470"
      stroke="#9bd8ff"
      stroke-width="2"
      opacity="0.22"
      filter="url(#soften-light)"
    />
    <path
      d="M-20 1180 C260 950 470 1320 740 1080 C980 870 1120 1190 1300 1010"
      stroke="#89e5d6"
      stroke-width="1.5"
      opacity="0.12"
      filter="url(#soften-light)"
    />
  </g>

  <g fill="none" stroke="#cfe9ff" stroke-linecap="round" opacity="0.14">
    <path d="M120 1280 C380 1110 620 1370 980 1150" stroke-width="1" />
    <path d="M170 1330 C420 1170 650 1410 1010 1200" stroke-width="0.8" />
    <path d="M230 1382 C470 1230 690 1450 1050 1250" stroke-width="0.6" />
  </g>

  <rect width="1200" height="1600" filter="url(#grain)" opacity="0.15" />
</svg>
