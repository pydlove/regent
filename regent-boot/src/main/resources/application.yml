server:
  address: 127.0.0.1
  port: 8787

spring:
  application:
    name: regent
  profiles:
    active: local

  datasource:
    # 三个参数都是为了绕开 MySQL 8 的经典坑，改动前请先读清楚：
    #   characterEncoding 必须是 **Java 字符集名**（UTF-8），写成 MySQL 的 utf8mb4 会直接
    #     抛 UnsupportedEncodingException: utf8mb4 导致连不上。Connector/J 8 下 UTF-8 即对应 utf8mb4。
    #   allowPublicKeyRetrieval 必需 —— MySQL 8 默认 caching_sha2_password，本地走非 SSL 连接时
    #     缺这个参数会报 Public Key Retrieval is not allowed。
    #   connectionTimeZone=UTC 与「DATETIME(3) 统一存 UTC」的约定配套，见 TECH_STACK.md
    url: jdbc:mysql://127.0.0.1:3306/regent?characterEncoding=UTF-8&connectionTimeZone=UTC&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource
    username: ${REGENT_DB_USERNAME:regent}
    password: ${REGENT_DB_PASSWORD:}

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    # 严禁 clean：它会删库。默认虽已关闭，但这里显式声明，见 AGENTS.md 数据库铁律第 2 条
    clean-disabled: true
    # 版本号必须严格递增，禁止分支并行导致的乱序执行
    out-of-order: false

  jackson:
    time-zone: UTC

  # 注册验证码邮件。账号密码只从环境变量或 application-local.yml 读取，不写进仓库。
  mail:
    host: ${SPRING_MAIL_HOST:smtp.126.com}
    port: ${SPRING_MAIL_PORT:465}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    protocol: smtp
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: ${SPRING_MAIL_AUTH:true}
      mail.smtp.ssl.enable: ${SPRING_MAIL_SSL:true}
      mail.smtp.starttls.enable: ${SPRING_MAIL_STARTTLS:false}
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

  # 图片附件是任务的一部分（截图、设计稿），默认的 1MB 只够传图标。
  # 这里的两道限额只是容器层的兜底，真正的判据在 regent.attachments.max-bytes：
  # 超出它由应用服务拒绝并给出人话，超出这里则是 MaxUploadSizeExceededException —— 也映射成 400。
  servlet:
    multipart:
      max-file-size: 32MB
      max-request-size: 64MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

# 平台自身的运行参数。集中在一个前缀下，是为了让「改了这里会影响正在跑的任务」
# 一眼可见 —— 它们与上面的数据库/框架配置不是一类东西。
regent:
  # 运行时目录：schema、执行临时文件。日志与 pid 由 deploy/ 脚本写在同一目录下，
  # 约定见 TECH_STACK.md 六：运行时产物一律不写仓库。
  home: ${REGENT_HOME:${user.home}/.regent}
  auth:
    # 不勾选保持登录时，浏览器关闭即失效，服务端最多保留七天。
    session-ttl: ${REGENT_AUTH_SESSION_TTL:PT168H}
    # 勾选保持登录后使用 180 天持久会话，剩余一半时自动顺延。
    remembered-session-ttl: ${REGENT_AUTH_REMEMBERED_SESSION_TTL:PT4320H}
    # 当前设备代理使用独立 Bearer 会话，可单独撤销，不依赖浏览器进程。
    device-session-ttl: ${REGENT_AUTH_DEVICE_SESSION_TTL:PT4320H}
    # 手机 App 使用独立访问令牌与轮换刷新令牌；浏览器 Cookie 不参与手机认证。
    mobile-access-ttl: ${REGENT_MOBILE_ACCESS_TTL:PT30M}
    mobile-refresh-ttl: ${REGENT_MOBILE_REFRESH_TTL:PT720H}
    # 本地 HTTP 开发默认 false；生产由反向代理提供 HTTPS 时必须设成 true。
    cookie-secure: ${REGENT_AUTH_COOKIE_SECURE:false}
    email-code:
      # 注册验证码 5 分钟有效，同一邮箱 60 秒后才能重发，每天最多 10 次。
      ttl: ${REGENT_EMAIL_CODE_TTL:PT5M}
      resend-cooldown: ${REGENT_EMAIL_CODE_COOLDOWN:PT60S}
      max-per-day: ${REGENT_EMAIL_CODE_MAX_PER_DAY:10}
      home-url: ${REGENT_PUBLIC_URL:http://127.0.0.1:12580}
  organization:
    # 邀请邮件里的公开链接。生产默认使用公网域名，自建环境可用 REGENT_PUBLIC_URL 覆盖。
    invitation-url: ${REGENT_PUBLIC_URL:https://ichuang.top/regent}
    invitation-ttl: ${REGENT_ORGANIZATION_INVITATION_TTL:P7D}
  attachments:
    # 图片落盘目录。运行时产物不进仓库（TECH_STACK.md 六），与日志、schema、runs 同级
    dir: ${REGENT_ATTACHMENTS_DIR:${regent.home}/attachments}
    # 单张图片上限（字节）。默认 10MB：手机截图、设计稿都够，再大就是该压缩的原图了
    max-bytes: ${REGENT_ATTACHMENT_MAX_BYTES:10485760}
  documents:
    # 任务文档单份上限。图片仍由 attachments.max-bytes 单独限制。
    max-bytes: ${REGENT_DOCUMENT_MAX_BYTES:26214400}
  code-standards:
    # 开发规范必须是可读文本；正文会在任务执行时注入，避免设备间路径不可见。
    max-bytes: ${REGENT_CODE_STANDARD_MAX_BYTES:524288}
    # 单任务全部规范的正文上限；超限在任务创建或派发前失败关闭。
    max-prompt-bytes: ${REGENT_CODE_STANDARD_MAX_PROMPT_BYTES:1048576}
  downloads:
    # 无 CDN 的安装包目录。发布时把 latest.json 和安装包放在这里，通过 /api/release/* 下载。
    dir: ${REGENT_DOWNLOADS_DIR:${regent.home}/downloads}
  execution:
    # 执行器命令。默认取 PATH 里的 codex；本地想干跑就把它指向一个假脚本
    codex-command: ${REGENT_CODEX_COMMAND:codex}
    # 单次执行的墙钟上限，ISO-8601（PT30M = 三十分钟）
    timeout: ${REGENT_EXEC_TIMEOUT:PT30M}
    # 首次启动的并发上限默认值。界面保存后以 execution_setting 表为准，运行时立即生效
    max-concurrency: ${REGENT_MAX_CONCURRENCY:1}
    # 是否给每个任务开独立分支。首次新建必须先经人工审批；关掉之后在当前分支上执行
    branch-enabled: ${REGENT_BRANCH_ENABLED:true}
    dispatch:
      # 任务由当前访问设备上的代理领取；后端不再默认拉起本机 Codex 代跑。
      enabled: ${REGENT_DISPATCH_ENABLED:false}
      interval-ms: 15000
      initial-delay-ms: 20000
      batch-size: 3
    recovery:
      # 启动后收敛上次进程留下的内部执行并立即续跑。关掉后它们会停在原状态，需人工处理
      enabled: ${REGENT_EXECUTION_RECOVERY_ENABLED:true}
  plan:
    scheduler:
      # 到点启动计划并刷新运行中计划；关闭后仍可人工触发，但执行结果不会自动收敛。
      enabled: ${REGENT_PLAN_SCHEDULER_ENABLED:true}
      interval-ms: 15000
      initial-delay-ms: 20000
      batch-size: 10
  deployment:
    # 远程 SSH 命令。部署脚本通过 stdin 传给远端 bash -s，不先上传到服务器。
    ssh-command: ${REGENT_SSH_COMMAND:ssh}
    # 单次部署的墙钟上限。超时后只终止本机 ssh 进程，远端脚本是否继续取决于远端信号处理。
    timeout: ${REGENT_DEPLOY_TIMEOUT:PT10M}
    # Codex 只读分析项目并生成部署脚本的墙钟上限。
    script-generation-timeout: ${REGENT_DEPLOY_SCRIPT_GENERATION_TIMEOUT:PT3M}
    workers: ${REGENT_DEPLOY_WORKERS:2}
    max-log-chars: ${REGENT_DEPLOY_MAX_LOG_CHARS:1048576}
  project:
    summary:
      # 项目注册后异步分析工作区。独立于任务执行池，默认一次只生成一个，避免同时烧多份 token。
      workers: ${REGENT_PROJECT_SUMMARY_WORKERS:1}
      timeout: ${REGENT_PROJECT_SUMMARY_TIMEOUT:PT10M}
  agent:
    # 外部执行者（codex 桌面版、别的 CLI、别的模型工具）走 /api/agent/* 认领任务。
    # 契约全文：GET /api/agent/contract.md。要让它独占派发，把上面 dispatch.enabled 关掉 ——
    # 内部心跳开着时，两边会抢同一批待执行任务。
    #
    # 租约时长（秒）：多久不心跳就按失联处理，判这次尝试失败并放开工作区。
    # 心跳间隔建议不超过它的三分之一，见 agent-protocol.md
    lease-seconds: ${REGENT_AGENT_LEASE_SECONDS:900}
    # 回给执行者的契约地址。它按这个地址去读协议全文与出参 schema
    contract-url: ${REGENT_AGENT_CONTRACT_URL:http://127.0.0.1:8787/api/agent/contract}
    lease-sweep:
      # 失联回收。关掉之后：执行者中途消失，任务会一直停在「执行中」并占着工作区
      enabled: ${REGENT_AGENT_LEASE_SWEEP_ENABLED:true}
      interval-ms: 60000
      initial-delay-ms: 45000
  testing:
    # 测试用例在任务完成后独立执行，不占用 codex 的任务执行位。
    timeout: ${REGENT_TEST_TIMEOUT:PT10M}
    max-output-bytes: ${REGENT_TEST_MAX_OUTPUT_BYTES:262144}
    workers: ${REGENT_TEST_WORKERS:2}
  review:
    # 任务收场后的审阅生成与 AI 预审独立于执行池，避免大 diff 占住任务执行位。
    workers: ${REGENT_REVIEW_WORKERS:2}
    # AI 审阅超时后自动退回规则预审；代码事实与分析状态仍会落库。
    timeout: ${REGENT_REVIEW_TIMEOUT:PT2M}
  speech:
    # 新建任务弹框的语音转写。录音由浏览器采集，停止后上传到本机 Whisper 离线处理。
    whisper-command: ${REGENT_WHISPER_COMMAND:whisper}
    model: ${REGENT_WHISPER_MODEL:base}
    timeout: ${REGENT_WHISPER_TIMEOUT:PT2M}
    max-bytes: ${REGENT_SPEECH_MAX_BYTES:20971520}
    # 图形化启动时 PATH 可能不含 Homebrew / conda，可在这里补目录。
    path-prefix: ${REGENT_SPEECH_PATH_PREFIX:}
  relay:
    install:
      # 设置页点击安装时调用的远程部署脚本。脚本必须能访问项目构建产物。
      script: ${REGENT_RELAY_INSTALL_SCRIPT:deploy/remote/deploy.sh}
      timeout: ${REGENT_RELAY_INSTALL_TIMEOUT:PT15M}
    monitor:
      # 默认地址只用于首次启动；界面保存后以 relay_setting 表为准。
      # 这里不读取共享密钥，密钥仍由 ~/.regent/relay-connector.env 独占。
      server-url: ${REGENT_RELAY_SERVER_URL:}
      enabled: ${REGENT_RELAY_MONITOR_ENABLED:true}
      request-timeout: ${REGENT_RELAY_MONITOR_TIMEOUT:PT3S}

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
